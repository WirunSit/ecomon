# บอกว่าแต่ละช่องใน sheet คืออะไร (docs/GAME_PLAN.md หัวข้อ 15.1)
# รัน: npm run assets   (หรือ python3 tools/slice_sheets.py --sheet S02.png)
#
# ฟิลด์:
#   rows, cols      ขนาดตาราง
#   category        กำหนดขนาดปลายทาง (หัวข้อ 15.2): monster, character, portrait, prop, icon, vfx, tile, background, keyart
#   rowCategories   (ไม่บังคับ) category ต่อแถว เช่น S07 แถวบนตัวเต็ม แถวล่างภาพหน้าอก
#   rowIds/colIds   ชื่อแถว/คอลัมน์ ใช้กับ out ที่มี {row} {col}
#   cellIds         ชื่อทีละช่อง (ซ้ายไปขวา บนลงล่าง) ใช้กับ out ที่มี {id}
#   bg              auto | alpha | white | none (none = ไม่ลบพื้นหลัง ใช้กับ tile/ฉาก)
#   split           gutter (หาเส้นช่องว่างระหว่างภาพ ค่าเริ่มต้น) | grid (แบ่งเท่ากัน)
#                   | seams (ช่องชิดกันไม่มีร่องแต่ขนาดไม่เท่ากัน: ตัดตามรอยต่อระหว่างลาย)
#   atlas           (ไม่บังคับ) ชื่อ texture atlas ที่จะรวมภาพไว้ให้ Phaser

S02.png:
  rows: 5
  cols: 6
  category: monster
  bg: alpha
  rowIds: [puibai, tanmeow, hinnoop, fungfiw, hedtoob]
  colIds: [f1_idle, f1_attack, f2_idle, f2_attack, f3_idle, f3_attack]
  out: assets/monsters/{row}/{col}.png
  atlas: monsters

