# tileset ของแผนที่ ประกอบจากภาพที่ตัดแล้ว — ลำดับ = gid 1..n ตรงกับ TILE ใน tools/make-test-map.ts
_tilesets:
  island_tiles:
    tileSize: 32
    columns: 4
    out: assets/tiles/island_tiles.png
    tiles:
      - tiles/src/short_grass
      - tiles/src/grass_flowers
      - tiles/src/tall_grass
      - tiles/src/dirt_path
      - tiles/src/dry_sand
      - tiles/src/shallow_water
      - tiles/src/deep_water
      - tiles/src/wooden_bridge
      - props/round_tree
      - props/mossy_rock
      - props/round_bush
      - props/village_house
      - props/healing_fountain

  # แผนที่เกาะนิเวศา (tools/make-world-map.ts) — ลำดับ = gid 1..n ตรงกับ TILES ในสคริปต์
