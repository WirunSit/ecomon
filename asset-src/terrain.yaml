# วิธีวาดพื้นแผนที่ (tools/render_maps.py) — ชนิดพื้นของแต่ละช่องมาจาก property "material" ของ tile ใน Tiled
# ภาพพื้นผิวมาจาก assets/tiles/src/<texture>.png (ตัดจาก S08 ด้วย npm run assets)
#
# วิธีวาด: เอาชิ้นเล็ก ๆ ของภาพพื้นผิวมาวางกระจายแบบสุ่ม (texture bombing) จึงไม่เห็นลายซ้ำเป็นตาราง
# แล้วผสมพื้นแต่ละชนิดด้วย mask ขอบนุ่มที่มี noise → ขอบโค้งเป็นธรรมชาติ ไม่เป็นขั้นบันได
#
# ฟิลด์ของ material:
#   texture    ชื่อภาพพื้นผิว
#   patch      ขนาดชิ้นที่วางบนแผนที่ (px) — ใหญ่ = ลายหยาบ/รายละเอียดน้อย
#   rotate     หมุนชิ้นได้ 90° (false = กลับซ้ายขวาอย่างเดียว เช่นหญ้าที่ต้องตั้งขึ้น)
#   blur       ความนุ่มของขอบ (หน่วย: ช่อง)
#   noise      ความขรุขระของขอบ (0 = เรียบ)
#   feather    ความกว้างการไล่สีตรงขอบ (0–0.5)
#   soften     ลดความตัดกันของลาย (0–1) ให้พื้นไม่ยุบยับแย่งสายตาจากตัวละคร
#   crisp      true = วาดทีละช่องแบบคม (สะพาน)
#   shadow     เงาใต้วัตถุ (px)
# ลำดับใน materials = ลำดับการวาด (ล่าง → บน) · ตัวแรกคือพื้นฐานทั้งแผนที่

